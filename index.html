<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraftHub: Your Learning Management Platform</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #1f2937;
            padding: 30px 15px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        header h1 {
            color: #8B5CF6;
            margin-bottom: 8px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        input, textarea, select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            width: 100%;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            padding: 11px 17px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #8B5CF6;
            color: white;
        }

        .btn-primary:hover {
            background-color: #7C3AED;
        }

        .btn-success {
            background-color: #F59E0B;
            color: white;
        }

        .btn-success:hover {
            background-color: #D97706;
        }

        .btn-danger {
            background-color: #EF4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #DC2626;
        }

        .btn-secondary {
            background-color: #6b7280;
            color: white;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .message {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            display: none;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f5f3ff;
            color: #6d28d9;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: #ede9fe;
        }

        .loading, .empty {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

        @media(max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            body {
                padding: 15px 8px;
            }

            .panel {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <header>
        <h1>CodeCraftHub: Your Learning Management Platform</h1>
        <p>Manage your learning courses in one place.</p>
    </header>

    <div id="message" class="message"></div>

    <section class="panel">
        <h2 id="formTitle">Add New Course</h2>

        <form id="courseForm">
            <input type="hidden" id="courseId">

            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Course Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="target_date">Target Date</label>
                    <input type="date" id="target_date" required>
                </div>

                <div class="form-group full-width">
                    <label for="description">Description</label>
                    <textarea id="description" required></textarea>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" required>
                        <option value="Not Started">Not Started</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <div class="actions">
                        <button type="submit" class="btn-primary" id="submitBtn">
                            Add Course
                        </button>
                        <button type="button" class="btn-secondary"
                                id="cancelBtn" hidden>
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </section>

    <section class="panel">
        <h2>My Courses</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>Course Name</th>
                    <th>Description</th>
                    <th>Target Date</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="courseList">
                    <tr>
                        <td colspan="6" class="loading">Loading courses...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</div>

<script>
    const API_URL = "/api/courses";

    const courseForm = document.getElementById("courseForm");
    const courseList = document.getElementById("courseList");
    const messageBox = document.getElementById("message");

    function showMessage(message, type) {
        messageBox.textContent = message;
        messageBox.className = "message " + type;

        setTimeout(() => {
            messageBox.className = "message";
        }, 4000);
    }

    async function apiRequest(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: {
                "Content-Type": "application/json",
                ...(options.headers || {})
            }
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Something went wrong");
        }

        return data;
    }

    async function loadCourses() {
        courseList.innerHTML =
            '<tr><td colspan="6" class="loading">Loading courses...</td></tr>';

        try {
            const courses = await apiRequest(API_URL);

            courseList.innerHTML = "";

            if (courses.length === 0) {
                courseList.innerHTML =
                    '<tr><td colspan="6" class="empty">No courses found. Add your first course above.</td></tr>';
                return;
            }

            courses.forEach(course => {
                const row = document.createElement("tr");

                const nameCell = document.createElement("td");
                nameCell.textContent = course.name;

                const descriptionCell = document.createElement("td");
                descriptionCell.textContent = course.description;

                const dateCell = document.createElement("td");
                dateCell.textContent = course.target_date;

                const statusCell = document.createElement("td");
                const statusBadge = document.createElement("span");
                statusBadge.className = "status";
                statusBadge.textContent = course.status;
                statusCell.appendChild(statusBadge);

                const createdCell = document.createElement("td");
                createdCell.textContent = new Date(
                    course.created_at
                ).toLocaleDateString();

                const actionsCell = document.createElement("td");
                const actions = document.createElement("div");
                actions.className = "actions";

                const editButton = document.createElement("button");
                editButton.className = "btn-success";
                editButton.textContent = "Edit";
                editButton.addEventListener("click", () => editCourse(course.id));

                const deleteButton = document.createElement("button");
                deleteButton.className = "btn-danger";
                deleteButton.textContent = "Delete";
                deleteButton.addEventListener("click", () => deleteCourse(course.id));

                actions.append(editButton, deleteButton);
                actionsCell.appendChild(actions);

                row.append(
                    nameCell,
                    descriptionCell,
                    dateCell,
                    statusCell,
                    createdCell,
                    actionsCell
                );

                courseList.appendChild(row);
            });

        } catch (error) {
            courseList.innerHTML =
                '<tr><td colspan="6" class="empty">Unable to load courses.</td></tr>';
            showMessage(error.message, "error");
        }
    }

    courseForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const id = document.getElementById("courseId").value;

        const course = {
            name: document.getElementById("name").value.trim(),
            description: document.getElementById("description").value.trim(),
            target_date: document.getElementById("target_date").value,
            status: document.getElementById("status").value
        };

        try {
            if (id) {
                await apiRequest(`${API_URL}/${encodeURIComponent(id)}`, {
                    method: "PUT",
                    body: JSON.stringify(course)
                });

                showMessage("Course updated successfully!", "success");
            } else {
                await apiRequest(API_URL, {
                    method: "POST",
                    body: JSON.stringify(course)
                });

                showMessage("Course added successfully!", "success");
            }

            resetForm();
            await loadCourses();

        } catch (error) {
            showMessage(error.message, "error");
        }
    });

    async function editCourse(id) {
        try {
            const course = await apiRequest(
                `${API_URL}/${encodeURIComponent(id)}`
            );

            document.getElementById("courseId").value = course.id;
            document.getElementById("name").value = course.name;
            document.getElementById("description").value = course.description;
            document.getElementById("target_date").value = course.target_date;
            document.getElementById("status").value = course.status;

            document.getElementById("formTitle").textContent = "Edit Course";
            document.getElementById("submitBtn").textContent = "Update Course";
            document.getElementById("cancelBtn").hidden = false;

            window.scrollTo({ top: 0, behavior: "smooth" });

        } catch (error) {
            showMessage(error.message, "error");
        }
    }

    async function deleteCourse(id) {
        if (!confirm("Are you sure you want to delete this course?")) {
            return;
        }

        try {
            await apiRequest(
                `${API_URL}/${encodeURIComponent(id)}`,
                { method: "DELETE" }
            );

            showMessage("Course deleted successfully!", "success");
            await loadCourses();

        } catch (error) {
            showMessage(error.message, "error");
        }
    }

    function resetForm() {
        courseForm.reset();
        document.getElementById("courseId").value = "";
        document.getElementById("formTitle").textContent = "Add New Course";
        document.getElementById("submitBtn").textContent = "Add Course";
        document.getElementById("cancelBtn").hidden = true;
    }

    document.getElementById("cancelBtn").addEventListener(
        "click", resetForm
    );

    loadCourses();
</script>
</body>
</html>
